services:
  - type: web
    name: copro-tickets-tracker
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: FROM_EMAIL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: REDIS_URL
        sync: false

  - type: worker
    name: copro-tickets-tracker-email-worker
    runtime: node
    buildCommand: npm install && npm run build:worker
    startCommand: node dist/email-worker.js
    envVars:
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
